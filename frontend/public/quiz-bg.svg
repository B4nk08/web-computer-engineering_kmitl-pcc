<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="8" stdDeviation="10" flood-color="#12325c" flood-opacity="0.16"/>
    </filter>
    <radialGradient id="orbBright" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#7ec4ff"/>
      <stop offset="38%" stop-color="#3b8ee8"/>
      <stop offset="100%" stop-color="#0d4d9a"/>
    </radialGradient>
    <radialGradient id="orbMid" cx="34%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5aa8f0"/>
      <stop offset="42%" stop-color="#1f6fc4"/>
      <stop offset="100%" stop-color="#0a3a78"/>
    </radialGradient>
    <radialGradient id="orbDark" cx="34%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#3d86d4"/>
      <stop offset="45%" stop-color="#155aa8"/>
      <stop offset="100%" stop-color="#08284f"/>
    </radialGradient>
    <radialGradient id="orbNavy" cx="34%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#2f6cb8"/>
      <stop offset="50%" stop-color="#0f3f80"/>
      <stop offset="100%" stop-color="#061e3c"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g filter="url(#shadow)">
    <!-- top-left, under logo -->
    <circle cx="430" cy="-20" r="270" fill="url(#orbNavy)"/>
    <!-- left mid -->
    <circle cx="-70" cy="430" r="270" fill="url(#orbMid)"/>
    <!-- bottom-left -->
    <circle cx="120" cy="1120" r="400" fill="url(#orbBright)"/>
    <!-- upper-center, above the quote -->
    <circle cx="980" cy="210" r="118" fill="url(#orbMid)"/>
    <!-- lower-center -->
    <circle cx="1180" cy="900" r="145" fill="url(#orbNavy)"/>
    <!-- bottom-right small -->
    <circle cx="1810" cy="930" r="95" fill="url(#orbNavy)"/>
    <!-- top-right huge -->
    <circle cx="1980" cy="70" r="460" fill="url(#orbMid)"/>
  </g>
</svg>
