services:
  # ---------- Database ----------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ce
      POSTGRES_PASSWORD: ce
      POSTGRES_DB: ce_web
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ce -d ce_web"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- pgAdmin (เว็บ) ----------
  # เปิดที่ http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:8
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      db:
        condition: service_healthy

  # ---------- Backend (Go) ----------
  # ถ้าจะรันแค่ Frontend ให้ comment block นี้ทั้งก้อน (และ db / pgadmin ด้วยถ้าไม่ใช้)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://ce:ce@db:5432/ce_web?sslmode=disable
      FRONTEND_URL: http://localhost:3000
      GIN_MODE: release
    depends_on:
      db:
        condition: service_healthy

  # ---------- Frontend (Next.js) ----------
  # ถ้าจะรันแค่ Backend ให้ comment block นี้ทั้งก้อน
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080

volumes:
  postgres_data:
